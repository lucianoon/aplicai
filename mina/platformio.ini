; Mina no M5Stack CoreS3. Nenhuma chave de API entra neste arquivo.

[env:m5stack-cores3]
platform = espressif32@7.1.3
; O CoreS3 tem 8 MB de PSRAM quad. O perfil padrão da placa é qio_qspi.
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
lib_deps =
    m5stack/M5Unified@0.2.25
    links2004/WebSockets@^2.4.1
build_flags =
    -std=gnu++17
