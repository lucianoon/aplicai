[project]
name = "itau-gestor-liquidez-ia"
version = "0.1.0"
description = "Gestor de Liquidez e Fatura com IA (Batalha de Agentes Itau): ADK, guardrails e nucleo deterministico"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk>=2.9,<3",
    "google-cloud-bigquery>=3.45.2",
    "google-cloud-dlp>=3.39.0",
    "google-cloud-pubsub>=2.41.0",
    "mcp>=1.10",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["google-adk[eval]>=2.9,<3", "pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning"]
